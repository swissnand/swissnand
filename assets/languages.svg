<svg xmlns="http://www.w3.org/2000/svg" width="580" height="230" viewBox="0 0 580 230">
<defs>
<linearGradient id="bgl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070c12"/><stop offset="1" stop-color="#0c1722"/></linearGradient>
<radialGradient id="g1l"><stop offset="0" stop-color="#2f86d0" stop-opacity=".55"/><stop offset="1" stop-color="#2f86d0" stop-opacity="0"/></radialGradient>
<radialGradient id="g2l"><stop offset="0" stop-color="#5aaaf0" stop-opacity=".45"/><stop offset="1" stop-color="#5aaaf0" stop-opacity="0"/></radialGradient>
<linearGradient id="edgel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/></linearGradient>
<filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
<clipPath id="cl"><rect width="580" height="230" rx="22"/></clipPath>
<style>
text{font-family:'Segoe UI',-apple-system,'SF Pro Display',Helvetica,Arial,sans-serif} .mono{font-family:'SF Mono',Menlo,Consolas,monospace}
.drift{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-80px,30px)}}
@media (prefers-reduced-motion:reduce){.rise,.drift{animation:none}}
.rise{animation:rise .8s ease-out backwards}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style></defs>
<g clip-path="url(#cl)">
<rect width="580" height="230" fill="url(#bgl)"/>
<g filter="url(#bl)"><circle class="drift" cx="470" cy="40" r="130" fill="url(#g1l)"/><circle cx="80" cy="230" r="100" fill="url(#g2l)"/></g>
<rect x="1" y="1" width="578" height="228" rx="21" fill="#fff" fill-opacity=".05" stroke="url(#edgel)" stroke-width="1.5"/>
<text x="28" y="44" font-size="19" font-weight="700" fill="#f2f7fb">Meistgenutzte Sprachen</text>
<text x="552" y="44" font-size="12" fill="#8fa3b8" text-anchor="end">4 Sprachen</text>
<clipPath id="bar"><rect x="28" y="66" width="524" height="12" rx="6"/></clipPath><g clip-path="url(#bar)">
<rect x="28" y="66" width="524" height="12" fill="#fff" fill-opacity=".08"/>
<rect x="28.0" y="66" width="424.7" height="12" fill="#f1e05a"/>
<rect x="452.7" y="66" width="48.8" height="12" fill="#3572A5"/>
<rect x="501.5" y="66" width="44.5" height="12" fill="#baa3d1"/>
<rect x="546.0" y="66" width="6.0" height="12" fill="#e34c26"/>
</g>
<g class="rise" style="animation-delay:0.00s"><circle cx="34" cy="107" r="6" fill="#f1e05a"/><text x="50" y="112" font-size="15" fill="#f2f7fb">JavaScript</text><text x="273" y="112" font-size="14" fill="#8fa3b8" text-anchor="end" class="mono">81.0 %</text></g>
<g class="rise" style="animation-delay:0.10s"><circle cx="304" cy="107" r="6" fill="#3572A5"/><text x="320" y="112" font-size="15" fill="#f2f7fb">Python</text><text x="543" y="112" font-size="14" fill="#8fa3b8" text-anchor="end" class="mono">9.3 %</text></g>
<g class="rise" style="animation-delay:0.20s"><circle cx="34" cy="143" r="6" fill="#baa3d1"/><text x="50" y="148" font-size="15" fill="#f2f7fb">CSS</text><text x="273" y="148" font-size="14" fill="#8fa3b8" text-anchor="end" class="mono">8.5 %</text></g>
<g class="rise" style="animation-delay:0.30s"><circle cx="304" cy="143" r="6" fill="#e34c26"/><text x="320" y="148" font-size="15" fill="#f2f7fb">HTML</text><text x="543" y="148" font-size="14" fill="#8fa3b8" text-anchor="end" class="mono">1.1 %</text></g>
</g></svg>