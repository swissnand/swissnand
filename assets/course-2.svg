<svg xmlns="http://www.w3.org/2000/svg" width="400" height="270" viewBox="0 0 400 270">
<defs>
<linearGradient id="bgk1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070c12"/><stop offset="1" stop-color="#0c1722"/></linearGradient>
<radialGradient id="g1k1"><stop offset="0" stop-color="#1a6aa8" stop-opacity=".55"/><stop offset="1" stop-color="#1a6aa8" stop-opacity="0"/></radialGradient>
<radialGradient id="g2k1"><stop offset="0" stop-color="#004984" stop-opacity=".45"/><stop offset="1" stop-color="#004984" stop-opacity="0"/></radialGradient>
<linearGradient id="edgek1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/></linearGradient>
<filter id="bk1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
<clipPath id="ck1"><rect width="400" height="270" rx="22"/></clipPath>
<style>
text{font-family:'Segoe UI',-apple-system,'SF Pro Display',Helvetica,Arial,sans-serif} .mono{font-family:'SF Mono',Menlo,Consolas,monospace}
.drift{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-80px,30px)}}
@media (prefers-reduced-motion:reduce){.rise,.drift{animation:none}}
.rise{animation:rise .8s ease-out backwards}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style></defs>
<g clip-path="url(#ck1)">
<rect width="400" height="270" fill="url(#bgk1)"/>
