<rect x="1" y="1" width="398" height="268" rx="21" fill="#fff" fill-opacity=".05" stroke="url(#edgek1)" stroke-width="1.5"/>
<rect x="24" y="22" width="123" height="26" rx="13" fill="#9ccbf5" fill-opacity="0.18" stroke="#9ccbf5" stroke-opacity=".45"/><text x="85.5" y="39.5" font-size="12" font-weight="600" fill="#cfe6fb" text-anchor="middle">Cloud &amp; DevOps</text><rect x="155" y="22" width="130" height="26" rx="13" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity=".45"/><text x="220.0" y="39.5" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Fortgeschritten</text><text x="24" y="86" font-size="21" font-weight="700" fill="#f2f7fb">Kubernetes Masterclass: Vom</text><text x="24" y="113" font-size="21" font-weight="700" fill="#f2f7fb">Einsteiger zum Profi</text><text x="24" y="146" font-size="13.5" fill="#cbd5e1">Über 200 Lektionen, eigenes Lab, vier grosse</text><text x="24" y="166" font-size="13.5" fill="#cbd5e1">Praxisprojekte – Kubernetes so lernen, dass du es</text><text x="24" y="186" font-size="13.5" fill="#cbd5e1">im Beruf wirklich einsetzen kannst</text><line x1="24" y1="212" x2="376" y2="212" stroke="#fff" stroke-opacity=".1"/><text x="24" y="244" font-size="13" fill="#8fa3b8">224 Lektionen · ca. 92 Std.</text><text x="376" y="244" font-size="17" font-weight="700" fill="#9ccbf5" text-anchor="end">CHF 149</text>
