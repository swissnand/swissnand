<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05090e"/><stop offset="1" stop-color="#0b1520"/></linearGradient>
    <radialGradient id="glow" cx=".82" cy=".05" r=".7"><stop offset="0" stop-color="#0a5fa3" stop-opacity=".75"/><stop offset=".45" stop-color="#004984" stop-opacity=".25"/><stop offset="1" stop-color="#004984" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx=".05" cy="1" r=".5"><stop offset="0" stop-color="#004984" stop-opacity=".35"/><stop offset="1" stop-color="#004984" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfe0fb"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5aaaf0"/><stop offset="1" stop-color="#5aaaf0" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="340" rx="24"/></clipPath>
    <style>
      text{font-family:-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:'SF Mono',Menlo,Consolas,monospace}
      .blink{animation:b 1.1s steps(1) infinite} @keyframes b{50%{opacity:0}}
      .float{animation:f 9s ease-in-out infinite alternate} @keyframes f{to{transform:translate(-40px,18px)}}
      .rise{animation:r .9s ease-out backwards} @keyframes r{from{opacity:0;transform:translateY(8px)}}
      @media (prefers-reduced-motion:reduce){.blink,.float,.rise{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect class="float" x="-40" y="-20" width="1280" height="380" fill="url(#glow)"/>
    <rect width="1200" height="340" fill="url(#glow2)"/>
    <g opacity=".9" transform="translate(965 78)">
      <rect width="150" height="150" rx="34" fill="#004984" stroke="#5aaaf0" stroke-opacity=".35"/>
      <path d="M58 30h34v28h28v34H92v28H58V92H30V58h28z" fill="#fff"/>
    </g>
    <g class="rise">
      <text x="84" y="132" font-size="78" font-weight="800" letter-spacing="10" fill="url(#t)">SWISSNAND</text>
    </g>
    <text class="rise" style="animation-delay:.15s" x="88" y="186" font-size="27" font-weight="600" fill="#e6eef6">Werkzeuge und Wissen für die IT.</text>
    <text class="rise" style="animation-delay:.3s" x="88" y="224" font-size="17" fill="#8fa6bd">NAND · Informatiker EFZ · Automation · KI · Schweiz</text>
    <rect x="88" y="252" width="420" height="40" rx="10" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/>
    <text class="mono" x="106" y="278" font-size="15" fill="#5aaaf0">$</text>
    <text class="mono" x="124" y="278" font-size="15" fill="#cfe0f0">swissnand --tools --kurse --automation <tspan class="blink" fill="#5aaaf0">▋</tspan></text>
    <rect x="88" y="304" width="320" height="2" fill="url(#line)"/>
    <rect x=".5" y=".5" width="1199" height="339" rx="23.5" fill="none" stroke="#5aaaf0" stroke-opacity=".18"/>
  </g>
</svg>