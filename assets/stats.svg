<g class="rise" style="animation-delay:0.24s"><rect x="386" y="66" width="166" height="70" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><rect x="386" y="84" width="3" height="34" rx="1.5" fill="#9ccbf5"/><text x="402" y="100" font-size="23" font-weight="700" fill="#f2f7fb">3 T</text><text x="402" y="121" font-size="12" fill="#8fa3b8">Streak aktuell</text></g>
<g class="rise" style="animation-delay:0.36s"><rect x="28" y="148" width="166" height="70" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><rect x="28" y="166" width="3" height="34" rx="1.5" fill="#9ccbf5"/><text x="44" y="182" font-size="23" font-weight="700" fill="#f2f7fb">3 T</text><text x="44" y="203" font-size="12" fill="#8fa3b8">Längster Streak</text></g>
<g class="rise" style="animation-delay:0.48s"><rect x="207" y="148" width="166" height="70" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><rect x="207" y="166" width="3" height="34" rx="1.5" fill="#5aaaf0"/><text x="223" y="182" font-size="23" font-weight="700" fill="#f2f7fb">4</text><text x="223" y="203" font-size="12" fill="#8fa3b8">Repos</text></g>
