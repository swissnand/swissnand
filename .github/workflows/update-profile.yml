name: Profil aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"      # jeden Tag ca. 05:17 Schweizer Zeit
  workflow_dispatch:           # Knopf «Run workflow» im Tab Actions
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Statistik und Kurse erzeugen
        env:
          # PROFILE_TOKEN (optional) zählt auch private Repos mit. Ohne ihn nur öffentliche.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          KF_URL: ${{ vars.KF_URL || 'https://knowledge-forge.swissnand.com' }}
          KF_COUNT: "3"
        run: python scripts/update_profile.py

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          if git diff --cached --quiet; then
            echo "Nichts Neues."
          else
            git commit -m "Profil: Statistik und Kurse aktualisiert"
            git push
          fi
